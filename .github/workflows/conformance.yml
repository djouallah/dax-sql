name: Conformance

# Runs the conformance suite (conformance/) against this repo through its adapter and prints the
# scoreboard. The engine is a black box: the runner gives the adapter the models, their data and
# the queries, and compares the rows it answers with Power BI's (conformance/golden/). And every
# query compiled with the emitter's rewrites and without, run on one DuckDB, must give the same
# rows (engines/dax-sql/agree.mjs): the rewrites change no answer, the known ones included.
# And the suite again through the query plan, against the same known list: as it is
# (DAXSQL_PLAN=raw), and optimized (DAXSQL_PLAN=1: the optimizer's passes, src/passes/).

on:
  push:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  dax-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Named, so that called from another workflow it still checks out this repository.
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The suite against dax-sql
        env:
          DAXSQL_TIMES: ${{ runner.temp }}/duckdb-times.json
        run: |
          node conformance/runner/run.mjs --adapter "node conformance/engines/dax-sql/adapter.mjs ." \
            --known conformance/engines/dax-sql/known.json --report "$RUNNER_TEMP/dax-sql.json"
      # Each query's time on DuckDB, measured as the T-SQL adapter measures Fabric's (the query
      # alone, from sent to its rows read), added up, and the slowest.
      - name: The time on DuckDB
        if: always()
        run: |
          test -f "$RUNNER_TEMP/duckdb-times.json" || exit 0
          node -e '
            const t = require(process.argv[1]);
            const sum = t.reduce((a, x) => a + x.ms, 0) / 1000;
            const rows = t.slice(0, 15).map(x => `| ${x.id} | ${(x.ms / 1000).toFixed(2)} |`).join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### The time on DuckDB\n\n${t.length} queries, ${sum.toFixed(1)} s added up.\n\n| query | s |\n|---|---|\n${rows}\n`);
            console.log(`${t.length} queries, ${sum.toFixed(1)} s added up`);
          ' "$RUNNER_TEMP/duckdb-times.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dax-sql-report
          path: |
            ${{ runner.temp }}/dax-sql.json
            ${{ runner.temp }}/duckdb-times.json

  agree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Named, so that called from another workflow it still checks out this repository.
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: With the rewrites and without
        run: node conformance/engines/dax-sql/agree.mjs .

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Named, so that called from another workflow it still checks out this repository.
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The query plan's operators (optimized, only the plan's simple operators)
        run: node conformance/engines/dax-sql/operators.mjs .
      - name: The suite through the query plan as it is
        if: always()
        env:
          DAXSQL_PLAN: raw
        run: |
          node conformance/runner/run.mjs --adapter "node conformance/engines/dax-sql/adapter.mjs ." \
            --known conformance/engines/dax-sql/known.json --report "$RUNNER_TEMP/plan-raw.json"
      # The plan before decorrelation, its scalars standard: its applies LATERAL and scalar
      # subqueries, which DuckDB unnests itself (the plan Substrait exports, correlated).
      - name: The suite through the correlated query plan
        if: always()
        env:
          DAXSQL_PLAN: correlated
        run: |
          node conformance/runner/run.mjs --adapter "node conformance/engines/dax-sql/adapter.mjs ."             --known conformance/engines/dax-sql/known.json,conformance/engines/dax-sql/known-plan.json --report "$RUNNER_TEMP/plan-correlated.json"
      # The correlated plan unnested (src/passes/unnest.js): no apply, no correlated EXISTS, the
      # plan an engine that does not unnest is given.
      - name: The suite through the unnested query plan
        if: always()
        env:
          DAXSQL_PLAN: unnest
          DAXSQL_TIMES: ${{ runner.temp }}/duckdb-unnest-times.json
        run: |
          node conformance/runner/run.mjs --adapter "node conformance/engines/dax-sql/adapter.mjs ."             --known conformance/engines/dax-sql/known.json,conformance/engines/dax-sql/known-plan.json --report "$RUNNER_TEMP/plan-unnest.json"
          node -e 'const t = require(process.argv[1]); const s = (t.reduce((a, x) => a + x.ms, 0) / 1000).toFixed(1); console.log(`time on DuckDB, unnested plan: ${t.length} queries, ${s} s added up`); require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n**Time on DuckDB, unnested plan:** ${t.length} queries, ${s} s added up.\n`)' "$RUNNER_TEMP/duckdb-unnest-times.json"
      - name: The suite through the optimized query plan
        if: always()
        env:
          DAXSQL_PLAN: "1"
        run: |
          node conformance/runner/run.mjs --adapter "node conformance/engines/dax-sql/adapter.mjs ." \
            --known conformance/engines/dax-sql/known.json,conformance/engines/dax-sql/known-plan.json --report "$RUNNER_TEMP/plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-report
          path: |
            ${{ runner.temp }}/plan-raw.json
            ${{ runner.temp }}/plan-correlated.json
            ${{ runner.temp }}/plan-unnest.json
            ${{ runner.temp }}/plan.json
