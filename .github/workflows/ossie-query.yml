name: Ossie queries

# The errors of Apache Ossie's (https://github.com/apache/ossie) Wide Table Query Interface, as
# its main is that day: each wide table case that raises one, by its Layer 3 query (JSON,
# formats/ossie-wide.js), must raise its code (formats/test/ossie-wide.mjs). A release needs it
# green: publish.yml runs it first. Ossie's cases that answer rows are Power BI's to answer: the
# suite holds them as DAX (conformance/tools/ossie/build.mjs: models scott, retail and stores, and
# the view expander's grid on every model), as every DAX query (conformance.yml). Runs every
# morning too: a run that fails with no change here is Ossie having moved.

on:
  push:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  queries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Named, so that called from another workflow it still checks out this repository.
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/checkout@v4
        with:
          repository: apache/ossie
          path: .ossie
      - name: The Ossie checked
        run: echo "Apache Ossie main at $(git -C .ossie rev-parse HEAD), $(git -C .ossie log -1 --format=%cs)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: The wide table cases that raise an error
        run: node formats/test/ossie-wide.mjs .ossie
