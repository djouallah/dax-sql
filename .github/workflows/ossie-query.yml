name: Ossie queries

# dax-sql's Ossie SQL, held to Apache Ossie (https://github.com/apache/ossie) as its main is that
# day, as DAX is held to Power BI (conformance.yml). A release needs it green: publish.yml runs
# it first.
#   - compliance/query: the query cases, the SCOTT data and model (formats/test/ossie-query.mjs);
#   - compliance/wide_table: each case's Layer 2 query (formats/test/ossie-wide.mjs);
#   - Ossie's view expander (ost/src/ossie_ost/expander.py) as an oracle: a grid of queries over
#     every model here and Ossie's, each answered by the expander's SQL and by dax-sql's, on the
#     same DuckDB (formats/test/ossie-expand.mjs).
# Ossie's ost is for these tests only: the npm package does not use it. Runs every morning too:
# a run that fails with no change here is Ossie having moved.

on:
  push:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  queries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Named, so that called from another workflow it still checks out this repository.
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/checkout@v4
        with:
          repository: apache/ossie
          path: .ossie
      - name: The Ossie checked
        run: echo "Apache Ossie main at $(git -C .ossie rev-parse HEAD), $(git -C .ossie log -1 --format=%cs)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - uses: astral-sh/setup-uv@v6
      - name: The query cases
        run: node formats/test/ossie-query.mjs .ossie
      - name: The wide table cases' Layer 2 queries
        run: node formats/test/ossie-wide.mjs .ossie
      - name: Against the view expander
        run: node formats/test/ossie-expand.mjs .ossie .ossie --report "$RUNNER_TEMP/expand.json"
      # The same, with none of the emitter's rewrites: they change no answer.
      - name: Without the rewrites
        env:
          DAXSQL_OPTIMIZE: "0"
        run: |
          set -euo pipefail
          node formats/test/ossie-query.mjs .ossie
          node formats/test/ossie-wide.mjs .ossie
          node formats/test/ossie-expand.mjs .ossie .ossie
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ossie-expand-report
          path: ${{ runner.temp }}/expand.json
          if-no-files-found: ignore
