# The site, https://djouallah.github.io/dax-sql/: docs/ with the compiler on main beside it
# (src/, formats/tmsl.js) and the tests' model (fixtures/contoso.js), so that every example on
# the page is compiled by the code it describes.
name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'formats/tmsl.js', 'test/fixtures/contoso.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The site
        run: |
          mkdir -p _site/formats _site/fixtures
          cp -r docs/. _site/
          cp -r src _site/src
          cp formats/tmsl.js _site/formats/
          cp test/fixtures/contoso.js _site/fixtures/
          touch _site/.nojekyll
      - name: Every example compiles
        run: |
          cat > /tmp/check.mjs <<'EOF'
          const s = process.argv[2];
          const { createCompiler } = await import(`${s}/src/index.js`);
          const { tmslToModel } = await import(`${s}/formats/tmsl.js`);
          const { bim } = await import(`${s}/fixtures/contoso.js`);
          const ex = await import(`${s}/examples.js`);
          const all = [...ex.problem.map(p => p.dax), ex.how, ex.sql, ex.unseen, ...ex.playground.map(p => p[1])];
          for (const dialect of ['duckdb', 'tsql']) for (const optimize of [true, false]) {
            const c = createCompiler(tmslToModel(bim), { dialect, optimize });
            for (const q of all) c.compile(q);
          }
          console.log(`${all.length} examples compile`);
          EOF
          node /tmp/check.mjs "$PWD/_site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
