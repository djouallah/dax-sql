# The site, https://djouallah.github.io/dax-sql/: docs/ with the compiler on main beside it
# (src/, formats/tmsl.js) and the tests' model (fixtures/contoso.js), so that every example on
# the page is compiled by the code it describes.
name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'formats/tmsl.js', 'test/fixtures/contoso.js', 'conformance/tools/site-results.mjs', '.github/workflows/pages.yml']
  # The "Ossie compiler" tab: the engines' latest results, deployed again when one has new ones.
  workflow_run:
    workflows: [Conformance, T-SQL, PostgreSQL, Polars, DataFusion]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the engines' reports, the artifacts of their latest runs
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The site
        run: |
          mkdir -p _site/formats _site/fixtures
          cp -r docs/. _site/
          cp -r src _site/src
          cp formats/tmsl.js _site/formats/
          cp test/fixtures/contoso.js _site/fixtures/
          touch _site/.nojekyll
      # Each engine's latest report on main (the latest completed run that has the artifact), as
      # results.json for the "Ossie compiler" tab.
      - name: The engines' results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A="$RUNNER_TEMP/reports"; mkdir -p "$A"
          for pair in conformance.yml:plan-report tsql.yml:tsql-report postgres.yml:postgres-plan-report-unnest polars.yml:polars-report datafusion.yml:datafusion-report; do
            wf=${pair%%:*}; art=${pair#*:}
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --status completed --limit 10 --json databaseId -q '.[].databaseId'); do
              gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$art" -D "$A/$art" >/dev/null 2>&1 && break
            done
          done
          node conformance/tools/site-results.mjs "$A" _site/results.json
      - name: Every example compiles
        run: |
          cat > /tmp/check.mjs <<'EOF'
          const s = process.argv[2];
          const { createCompiler } = await import(`${s}/src/index.js`);
          const { tmslToModel } = await import(`${s}/formats/tmsl.js`);
          const { bim } = await import(`${s}/fixtures/contoso.js`);
          const ex = await import(`${s}/examples.js`);
          const all = [...ex.problem.filter(p => p.dax).map(p => p.dax), ...ex.playground.map(p => p[1])];
          for (const dialect of ['duckdb', 'tsql']) for (const optimize of [true, false]) {
            const c = createCompiler(tmslToModel(bim), { dialect, optimize });
            for (const q of all) c.compile(q);
          }
          console.log(`${all.length} examples compile`);
          EOF
          node /tmp/check.mjs "$PWD/_site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
