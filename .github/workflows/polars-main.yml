name: Polars main

# Polars built from its main branch, when main has moved since the last build: its wheels
# (polars, and polars-runtime-32, the compiled part) published as the assets of this repository's
# release `polars-main`, which polars.yml installs to run the suite; polars.yml is run on them
# once they are published. Daily, and by hand (force: build even when main has not moved). The SQL
# shapes Polars lacked (conformance/engines/dax-sql-polars/repros.py, against DuckDB) go to the
# job summary.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "pola-rs/polars ref to build"
        default: main
      force:
        description: "build even when the ref is the one built last"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: polars-main
  cancel-in-progress: false

permissions:
  contents: write   # the release polars-main and its wheels
  actions: write    # polars.yml run on the new wheels

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # The commit to build, and the one built last (in the release's notes): nothing to do when
      # they are the same.
      - name: Has main moved
        id: head
        run: |
          sha=$(git ls-remote https://github.com/pola-rs/polars "${{ inputs.ref || 'main' }}" | head -1 | cut -f1)
          [ -n "$sha" ] || sha="${{ inputs.ref }}"
          built=$(gh release view polars-main --json body -q .body 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -1 || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$built" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Polars main is \`$sha\`, the one built last: nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Polars \`$sha\` to build (built last: \`${built:-none}\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.head.outputs.build == 'true'
        with:
          repository: pola-rs/polars
          ref: ${{ steps.head.outputs.sha }}
          path: polars
      - uses: actions/setup-python@v5
        if: steps.head.outputs.build == 'true'
        with:
          python-version: "3.12"
      - name: Rust, from Polars' rust-toolchain.toml
        if: steps.head.outputs.build == 'true'
        working-directory: polars
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        if: steps.head.outputs.build == 'true'
        with:
          workspaces: polars
          save-if: true
      - name: The wheels (its Makefile's build-fast-release, as wheels)
        if: steps.head.outputs.build == 'true'
        run: |
          pip install -q maturin build
          # The nightly Polars pins, not the runner's stable: rustup reads rust-toolchain.toml from
          # the directory a build runs in.
          export RUSTUP_TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' polars/rust-toolchain.toml)
          echo "toolchain $RUSTUP_TOOLCHAIN"
          mkdir -p wheels
          (cd polars && maturin build -m py-polars/runtime/polars-runtime-32/Cargo.toml --features backtrace_filter --profile fast-release -o ../wheels)
          python -m build --wheel --outdir wheels polars/py-polars
          ls -l wheels
      - name: The wheels work
        if: steps.head.outputs.build == 'true'
        run: |
          python -m venv pl-main
          pl-main/bin/pip install -q --no-deps wheels/*.whl
          pl-main/bin/pip install -q duckdb
          pl-main/bin/python -c "import polars as pl; print(pl.__version__, getattr(pl, '__build_commit__', ''))"
          pl-main/bin/python conformance/engines/dax-sql-polars/repros.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Published as the release polars-main, and polars.yml run on it
        if: steps.head.outputs.build == 'true'
        run: |
          sha=${{ steps.head.outputs.sha }}
          notes="Polars built from pola-rs/polars $sha ($(git -C polars log -1 --format=%cs)), by polars-main.yml: the wheels polars.yml installs."
          if gh release view polars-main >/dev/null 2>&1; then
            for a in $(gh release view polars-main --json assets -q '.assets[].name'); do gh release delete-asset polars-main "$a" -y; done
            gh release edit polars-main --notes "$notes"
          else
            gh release create polars-main --title "Polars main" --notes "$notes" --prerelease
          fi
          gh release upload polars-main wheels/*.whl --clobber
          gh workflow run polars.yml --ref main
