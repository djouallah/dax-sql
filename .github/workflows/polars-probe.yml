name: Polars probe

# Polars built from pola-rs/polars (main by default), by hand only: the SQL shapes Polars may lack
# (repros.py, issues.py, probes.py in conformance/engines/dax-sql-polars), each against DuckDB, on
# that build, to the job summary. For an issue to file upstream: checked on main, not on a release
# (the suite itself stays on the release, polars.yml). The wheels are this run's artifact.
#   code        a snippet (an issue's, as written) run on that Polars first, its output and
#               traceback in the summary
#   wheels_run  a run of this workflow whose wheels to use instead of building (its artifact
#               polars-wheels)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "pola-rs/polars ref to build"
        default: main
      code:
        description: "Python to run on that Polars before the probes (an issue's snippet)"
        type: string
        default: ""
      wheels_run:
        description: "A run id of this workflow whose wheels to reuse (no build)"
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # No token left in .git/config: the snippet runs here.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        if: inputs.wheels_run == ''
        with:
          repository: pola-rs/polars
          ref: ${{ inputs.ref }}
          path: polars
          persist-credentials: false
      - name: Rust, from Polars' rust-toolchain.toml
        if: inputs.wheels_run == ''
        working-directory: polars
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        if: inputs.wheels_run == ''
        with:
          workspaces: polars
      - name: The wheels
        if: inputs.wheels_run == ''
        run: |
          pip install -q maturin build
          export RUSTUP_TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' polars/rust-toolchain.toml)
          mkdir -p wheels
          (cd polars && maturin build -m py-polars/runtime/polars-runtime-32/Cargo.toml --features backtrace_filter --profile fast-release -o ../wheels)
          python -m build --wheel --outdir wheels polars/py-polars
      - uses: actions/upload-artifact@v4
        if: inputs.wheels_run == ''
        with:
          name: polars-wheels
          path: wheels/*.whl
      - name: The wheels of run ${{ inputs.wheels_run }}
        if: inputs.wheels_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.wheels_run }}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n polars-wheels -D wheels
      - name: This Polars, and DuckDB
        if: always()
        env:
          RUN: ${{ inputs.wheels_run }}
        run: |
          python -m venv pl
          pl/bin/pip install -q --no-deps wheels/*.whl
          pl/bin/pip install -q duckdb
          version=$(pl/bin/python -c "import polars as pl; print(pl.__version__)")
          if [ -n "$RUN" ]; then built="wheels from run $RUN"
          else built="$(git -C polars rev-parse HEAD) ($(git -C polars log -1 --format=%cs))"; fi
          echo "Polars $version, $built" | tee -a "$GITHUB_STEP_SUMMARY"
      # The snippet as given (from the input, by the environment: never written into the script).
      - name: The snippet
        if: always() && inputs.code != ''
        env:
          CODE: ${{ inputs.code }}
        run: |
          printf '%s\n' "$CODE" > "$RUNNER_TEMP/snippet.py"
          set +e
          pl/bin/python "$RUNNER_TEMP/snippet.py" > "$RUNNER_TEMP/snippet.out" 2>&1
          status=$?
          cat "$RUNNER_TEMP/snippet.out"
          { echo "#### The snippet (exit $status)"; echo '```'; cat "$RUNNER_TEMP/snippet.out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The probes, on this Polars and DuckDB
        if: always()
        run: |
          pl/bin/python conformance/engines/dax-sql-polars/probes.py | tee -a "$GITHUB_STEP_SUMMARY"
          pl/bin/python conformance/engines/dax-sql-polars/repros.py | tee -a "$GITHUB_STEP_SUMMARY"
          pl/bin/python conformance/engines/dax-sql-polars/issues.py | tee -a "$GITHUB_STEP_SUMMARY"
