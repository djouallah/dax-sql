name: Polars

# Runs the conformance suite on Polars built from its main branch (the wheels of the release
# polars-main, which polars-main.yml builds by hand): each query compiled with the `polars`
# dialect through the query plan unnested (planSql { unnest: true }), run on Polars' SQLContext
# over the suite's CSVs (conformance/engines/dax-sql-polars/adapter.mjs), held to Power BI's
# answers and the known lists: DuckDB's (what holds for every engine) and Polars' own. Then the
# plan correlated (POLARS_PLAN=correlated: Polars main unnests correlated subqueries itself), a
# measure beside it that does not fail the job: its matches, errors (those of SQL with a LATERAL
# apart: Polars has none) and time.

on:
  push:
    paths:
      - "src/**"
      - "formats/**"
      - "conformance/queries/**"
      - "conformance/golden/**"
      - "conformance/runner/**"
      - "conformance/engines/dax-sql/known*.json"
      - "conformance/engines/dax-sql-polars/**"
      - ".github/workflows/polars.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: polars-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  polars:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Polars main (the release polars-main's wheels)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download polars-main -R "${{ github.repository }}" -p '*.whl' -D wheels
          gh release view polars-main -R "${{ github.repository }}" --json body -q .body >> "$GITHUB_STEP_SUMMARY"
          pip install -q --no-deps wheels/*.whl
          python -c "import polars as pl; print(pl.__version__, getattr(pl, '__build_commit__', ''))"
      # The SQL shapes dax-sql's Polars dialect works around, on this Polars, against DuckDB.
      - name: The SQL shapes, on Polars main
        if: always()
        run: |
          pip install -q duckdb
          python conformance/engines/dax-sql-polars/repros.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The issue drafts' examples, as drafted
        if: always()
        run: python conformance/engines/dax-sql-polars/issues.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The suite on Polars, through the unnested query plan
        env:
          PY: python
          DAXSQL_TIMES: ${{ runner.temp }}/polars-times.json
        run: |
          node conformance/runner/run.mjs --adapter "node conformance/engines/dax-sql-polars/adapter.mjs ." \
            --known conformance/engines/dax-sql-polars/known.json --known-shared conformance/engines/dax-sql/known.json \
            --report "$RUNNER_TEMP/polars.json"
      - name: The suite on Polars, through the correlated query plan (a measure)
        if: always()
        env:
          PY: python
          POLARS_PLAN: correlated
          DAXSQL_TIMES: ${{ runner.temp }}/polars-correlated-times.json
        run: |
          node conformance/runner/run.mjs --adapter "node conformance/engines/dax-sql-polars/adapter.mjs ." \
            --known conformance/engines/dax-sql-polars/known.json --known-shared conformance/engines/dax-sql/known.json \
            --report "$RUNNER_TEMP/polars-correlated.json" || true
      # Each plan's errors by kind (their text with names and numbers left out), the most frequent
      # first, and the time: what to fix next.
      - name: Summary
        if: always()
        run: |
          node -e '
            const fs = require("fs"), out = [];
            for (const [label, rep, tim] of [["unnested", "polars.json", "polars-times.json"], ["correlated", "polars-correlated.json", "polars-correlated-times.json"]]) {
              const dir = process.env.RUNNER_TEMP;
              if (!fs.existsSync(`${dir}/${rep}`)) continue;
              const r = JSON.parse(fs.readFileSync(`${dir}/${rep}`, "utf8")), t = r.total;
              let tm = [];
              try { tm = JSON.parse(fs.readFileSync(`${dir}/${tim}`, "utf8")); } catch {}
              const lateral = new Set(tm.filter(x => x.lateral).map(x => x.id));
              out.push(`### Polars main, ${label} plan`, "", "| match | fail | error | unsupported | known |", "|---|---|---|---|---|", `| ${t.match} | ${t.fail} | ${t.error} | ${t.unsupported} | ${t.known} |`, "");
              const errs = r.queries.filter(q => q.outcome === "error" && !q.known);
              if (lateral.size) out.push(`**SQL with a LATERAL:** ${lateral.size} queries; ${errs.filter(q => lateral.has(q.id)).length} of the errors.`, "");
              const groups = new Map();
              for (const q of errs) {
                const k = String(q.detail ?? "").replace(/\s+/g, " ").replace(/"[^"]*"|\x27[^\x27]*\x27|\d+/g, "…").slice(0, 140);
                const g = groups.get(k) ?? { n: 0, ex: q.id };
                g.n++; groups.set(k, g);
              }
              out.push("| errors | kind | e.g. |", "|---|---|---|", ...[...groups].sort((a, b) => b[1].n - a[1].n).slice(0, 40).map(([k, g]) => `| ${g.n} | ${k.replace(/\|/g, "\|")} | ${g.ex} |`), "");
              const fails = r.queries.filter(q => q.outcome === "fail" && !q.known).map(q => q.id);
              out.push(`**Different answers (${fails.length}):** ${fails.slice(0, 40).join(", ")}`, "");
              if (tm.length) out.push(`**Time:** ${tm.length} queries, ${(tm.reduce((a, x) => a + x.ms, 0) / 1000).toFixed(1)} s added up; the slowest: ${tm.slice(0, 8).map(x => `${x.id} ${(x.ms / 1000).toFixed(1)} s`).join(", ")}`, "");
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
            console.log(out.join("\n"));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polars-report
          path: |
            ${{ runner.temp }}/polars.json
            ${{ runner.temp }}/polars-times.json
            ${{ runner.temp }}/polars-correlated.json
            ${{ runner.temp }}/polars-correlated-times.json
