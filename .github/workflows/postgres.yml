name: PostgreSQL

# Runs the conformance suite with the postgres dialect on a PostgreSQL server
# (conformance/engines/dax-sql-postgres/adapter.mjs): each query compiled to PostgreSQL's SQL and
# run over the suite's data copied into it, held to Power BI's answers and
# engines/dax-sql-postgres/known.json. Its answers are checked; its time is reported.

on:
  push:
    paths:
      - "src/**"
      - "formats/**"
      - "conformance/queries/**"
      - "conformance/golden/**"
      - "conformance/runner/**"
      - "conformance/engines/dax-sql/db.mjs"
      - "conformance/engines/dax-sql-postgres/**"
      - ".github/workflows/postgres.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: postgres-${{ github.ref }}
  # A run waits for the one before (its plan job takes long): none is cut short by the next push.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          # Text sorted and compared by code point, as dax-sql's text is (DuckDB's, T-SQL's BIN2).
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: conformance/engines/dax-sql-postgres
      - name: The suite on PostgreSQL
        env:
          PG_TIMES: ${{ runner.temp }}/pg-times.json
          # Answers are what is checked, not time (a two-core runner beside the server: a query near
          # any limit passes or not by chance); the limit is for a query that would not end. The
          # slowest are in the summary. One session a core.
          PG_TIMEOUT_MS: 300000
          PG_SESSIONS: 2
          PG_PLANS: ${{ runner.temp }}/pg-plans.md
        run: |
          node conformance/runner/run.mjs --adapter "node conformance/engines/dax-sql-postgres/adapter.mjs ." \
            --known conformance/engines/dax-sql-postgres/known.json,conformance/engines/dax-sql-postgres/known-compile.json --report "$RUNNER_TEMP/postgres.json"
      - name: The slowest queries
        if: always()
        run: |
          test -f "$RUNNER_TEMP/pg-times.json" || exit 0
          node -e '
            const t = require(process.argv[1]).slice(0, 15);
            const rows = t.map(x => `| ${x.id} | ${(x.ms / 1000).toFixed(2)} |`).join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### The slowest on PostgreSQL\n\n| query | s |\n|---|---|\n${rows}\n`);
          ' "$RUNNER_TEMP/pg-times.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-report
          path: |
            ${{ runner.temp }}/postgres.json
            ${{ runner.temp }}/pg-times.json
            ${{ runner.temp }}/pg-plans.md

  # The suite through the optimized query plan (DAXSQL_PLAN=1) and the correlated plan unnested
  # (DAXSQL_PLAN=unnest: src/passes/unnest.js), against the known list (not known-compile.json:
  # the compiled SQL's slow queries, which the plans answer): each reports the slowest.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        plan: ["1", unnest]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: conformance/engines/dax-sql-postgres
      - name: The suite on PostgreSQL through the query plan (${{ matrix.plan == 'unnest' && 'unnested' || 'optimized' }})
        env:
          DAXSQL_PLAN: ${{ matrix.plan }}
          PG_TIMES: ${{ runner.temp }}/pg-times.json
          # 30 s a query, so the run ends and says which are slow; PostgreSQL's plan of each, in
          # the artifact.
          PG_TIMEOUT_MS: 30000
          PG_SESSIONS: 2
          PG_PLANS: ${{ runner.temp }}/pg-plans.md
        run: |
          node conformance/runner/run.mjs --adapter "node conformance/engines/dax-sql-postgres/adapter.mjs ." \
            --known conformance/engines/dax-sql-postgres/known.json --report "$RUNNER_TEMP/postgres-plan.json"
      - name: The slowest queries, and those known as slow
        if: always()
        env:
          PLAN: ${{ matrix.plan == 'unnest' && 'unnested' || 'optimized' }}
        run: |
          test -f "$RUNNER_TEMP/pg-times.json" || exit 0
          node -e '
            const path = require("path");
            const all = require(process.argv[1]), slow = [...require(path.resolve(process.argv[2])), ...require(path.resolve(process.argv[3]))].filter(k => /^slow/.test(k.reason)).map(k => k.id);
            const row = x => `| ${x.id} | ${(x.ms / 1000).toFixed(2)} |`;
            const known = slow.map(id => all.find(x => x.id === id) ?? { id, ms: NaN });
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Through the query plan (${process.env.PLAN}): the slowest\n\n| query | s |\n|---|---|\n${all.slice(0, 15).map(row).join("\n")}\n\n### Known as slow\n\n| query | s |\n|---|---|\n${known.map(row).join("\n")}\n`);
          ' "$RUNNER_TEMP/pg-times.json" conformance/engines/dax-sql-postgres/known.json conformance/engines/dax-sql-postgres/known-compile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-plan-report-${{ matrix.plan == 'unnest' && 'unnest' || 'optimized' }}
          path: |
            ${{ runner.temp }}/postgres-plan.json
            ${{ runner.temp }}/pg-times.json
            ${{ runner.temp }}/pg-plans.md
