name: Scale

# The tpcds queries of the suite on TPC-DS at a scale factor (conformance/tools/tpcds/scale.mjs,
# DuckDB's dsdgen in the model's shape: SF1, 2.9 million store sales and 1.4 million catalog
# sales; SF10 ten times that), each compiled and run on DuckDB (tools/tpcds/scale-run.mjs): the SQL
# as it behaves on real volumes, which the suite's small data never shows. It fails when a query
# fails or takes more than the timeout, or the compiler refuses one Power BI answers: on a push
# and a release (publish.yml) at SF1, 120 s each. Polars and DataFusion run the same queries on the
# same data, each answer held to DuckDB's (tools/tpcds/scale-engine.mjs; answers of more than
# 100,000 rows left out): a measure, not a gate. By hand: the scale factor, the timeout and the
# engines are inputs.

on:
  push:
    paths:
      - "src/**"
      - "formats/**"
      - "conformance/queries/tpcds/**"
      - "conformance/tools/tpcds/**"
      - ".github/workflows/scale.yml"
  workflow_dispatch:
    inputs:
      sf:
        description: "TPC-DS scale factor"
        default: "1"
      timeout:
        description: "A query's time at most (seconds)"
        default: "120"
      engines:
        description: "Engines beside DuckDB"
        type: choice
        default: polars and datafusion
        options:
          - polars and datafusion
          - polars
          - datafusion
          - duckdb only
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SF: ${{ inputs.sf || '1' }}
  TIMEOUT: ${{ inputs.timeout || '120' }}

permissions:
  contents: read

jobs:
  duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Named, so that called from another workflow it still checks out this repository.
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TPC-DS at SF${{ env.SF }}
        run: node conformance/tools/tpcds/scale.mjs "$SF" "$RUNNER_TEMP/tpcds.duckdb"
      - name: The tpcds queries at SF${{ env.SF }} on DuckDB
        run: |
          node conformance/tools/tpcds/scale-run.mjs "$RUNNER_TEMP/tpcds.duckdb" --no-agree --timeout "$TIMEOUT" \
            --gate --report "$RUNNER_TEMP/duckdb.json" --answers "$RUNNER_TEMP/answers.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duckdb
          path: |
            ${{ runner.temp }}/duckdb.json
            ${{ runner.temp }}/answers.json

  # The other engines: the tables again (dsdgen is deterministic) as a model folder, each engine's
  # adapter as the suite's, DuckDB's answers from the job above.
  engines:
    needs: duckdb
    if: ${{ always() && inputs.engines != 'duckdb only' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(inputs.engines == 'polars' && '["polars"]' || inputs.engines == 'datafusion' && '["datafusion"]' || '["polars","datafusion"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Polars 2.2.0
        if: matrix.engine == 'polars'
        run: pip install -q "polars==2.2.0"
      - name: DataFusion
        if: matrix.engine == 'datafusion'
        run: pip install -q -r conformance/engines/dax-sql-datafusion/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: duckdb
          path: ${{ runner.temp }}/duck
      - name: TPC-DS at SF${{ env.SF }}, as a model folder
        run: node conformance/tools/tpcds/scale.mjs "$SF" "$RUNNER_TEMP/tpcds.duckdb" --model-dir "$RUNNER_TEMP/tpcds"
      - name: The tpcds queries at SF${{ env.SF }} on ${{ matrix.engine }}
        env:
          PY: python
          DATAFUSION_PYTHON: python
          DATAFUSION_MEMORY: "6000000000"
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          export POLARS_TIMEOUT_MS=$((TIMEOUT * 1000)) DATAFUSION_TIMEOUT=$TIMEOUT
          node conformance/tools/tpcds/scale-engine.mjs --adapter "node conformance/engines/dax-sql-${{ matrix.engine }}/adapter.mjs ." \
            --label "${{ matrix.engine }}" --model-dir "$RUNNER_TEMP/tpcds" --answers "$RUNNER_TEMP/duck/answers.json" \
            --report "$RUNNER_TEMP/${{ matrix.engine }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.engine }}
          path: ${{ runner.temp }}/${{ matrix.engine }}.json
