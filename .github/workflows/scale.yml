name: Scale

# The tpcds queries of the suite on TPC-DS at a scale factor (conformance/tools/tpcds/scale.mjs,
# DuckDB's dsdgen in the model's shape: SF1, 2.9 million store sales and 1.4 million catalog
# sales; SF10 ten times that), on each engine, for the SQL as it behaves on real volumes and the
# engines' times side by side:
#   data     the tables (a DuckDB file and a model folder of CSVs, cached by scale factor) and
#            DuckDB's answers, each a count of rows and a hash (tools/tpcds/scale-run.mjs
#            --answers), every engine's answer held to them;
#   engines  each engine on the same data, a job of its own: DuckDB (tools/tpcds/scale-run.mjs
#            --gate, the release gate: a query that fails, takes more than the timeout, or is
#            refused where Power BI answers it fails it), DataFusion, and Polars by hand
#            (tools/tpcds/scale-engine.mjs, answers of more than 100,000 rows left out), not gates;
#   compare  the engines' times and answers in one table (tools/tpcds/scale-compare.mjs).
# On a push and a release (publish.yml): SF1, 120 s, DuckDB and DataFusion.

on:
  push:
    paths:
      - "src/**"
      - "formats/**"
      - "conformance/queries/tpcds/**"
      - "conformance/tools/tpcds/**"
      - ".github/workflows/scale.yml"
  workflow_dispatch:
    inputs:
      sf:
        description: "TPC-DS scale factor"
        default: "1"
      timeout:
        description: "A query's time at most (seconds)"
        default: "120"
      engines:
        description: "Engines beside DuckDB"
        type: choice
        default: datafusion
        options:
          - datafusion
          - polars and datafusion
          - polars
          - duckdb only
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SF: ${{ inputs.sf || '1' }}
  TIMEOUT: ${{ inputs.timeout || '120' }}

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Named, so that called from another workflow it still checks out this repository.
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The tables, cached
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tpcds
          key: tpcds-sf${{ env.SF }}-${{ hashFiles('conformance/tools/tpcds/scale.mjs', 'conformance/models/tpcds/model.bim') }}
      - name: TPC-DS at SF${{ env.SF }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: node conformance/tools/tpcds/scale.mjs "$SF" "$RUNNER_TEMP/tpcds/tpcds.duckdb" --model-dir "$RUNNER_TEMP/tpcds/model"
      - name: DuckDB's answers
        run: |
          node conformance/tools/tpcds/scale-run.mjs "$RUNNER_TEMP/tpcds/tpcds.duckdb" --no-agree --timeout "$TIMEOUT" \
            --answers "$RUNNER_TEMP/answers.json"
      - uses: actions/upload-artifact@v4
        with:
          name: answers
          path: ${{ runner.temp }}/answers.json

  engines:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # DuckDB's job is the gate; the others are a measure.
    continue-on-error: ${{ matrix.engine != 'duckdb' }}
    strategy:
      fail-fast: false
      matrix:
        # Polars by hand only (its SF1 run takes most of half an hour).
        engine: ${{ fromJSON(inputs.engines == 'duckdb only' && '["duckdb"]' || inputs.engines == 'polars' && '["duckdb","polars"]' || inputs.engines == 'polars and datafusion' && '["duckdb","datafusion","polars"]' || '["duckdb","datafusion"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        if: matrix.engine != 'duckdb'
        with:
          python-version: "3.12"
      - name: Polars 2.2.0
        if: matrix.engine == 'polars'
        run: pip install -q "polars==2.2.0"
      - name: DataFusion
        if: matrix.engine == 'datafusion'
        run: pip install -q -r conformance/engines/dax-sql-datafusion/requirements.txt
      - name: The tables
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tpcds
          key: tpcds-sf${{ env.SF }}-${{ hashFiles('conformance/tools/tpcds/scale.mjs', 'conformance/models/tpcds/model.bim') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: answers
          path: ${{ runner.temp }}/duck
      - name: The tpcds queries at SF${{ env.SF }} on DuckDB
        if: matrix.engine == 'duckdb'
        run: |
          node conformance/tools/tpcds/scale-run.mjs "$RUNNER_TEMP/tpcds/tpcds.duckdb" --no-agree --timeout "$TIMEOUT" \
            --gate --report "$RUNNER_TEMP/duckdb.json"
      - name: The tpcds queries at SF${{ env.SF }} on ${{ matrix.engine }}
        if: matrix.engine != 'duckdb'
        env:
          PY: python
          DATAFUSION_PYTHON: python
          DATAFUSION_MEMORY: "6000000000"
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          export POLARS_TIMEOUT_MS=$((TIMEOUT * 1000)) DATAFUSION_TIMEOUT=$TIMEOUT
          node conformance/tools/tpcds/scale-engine.mjs --adapter "node conformance/engines/dax-sql-${{ matrix.engine }}/adapter.mjs ." \
            --label "${{ matrix.engine }}" --model-dir "$RUNNER_TEMP/tpcds/model" --answers "$RUNNER_TEMP/duck/answers.json" \
            --report "$RUNNER_TEMP/${{ matrix.engine }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.engine }}
          path: ${{ runner.temp }}/${{ matrix.engine }}.json

  compare:
    needs: engines
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: djouallah/dax-sql
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports
      - name: The engines side by side
        run: node conformance/tools/tpcds/scale-compare.mjs "$RUNNER_TEMP/reports"
