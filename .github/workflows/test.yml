name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The unit tests, and what of src/ they reach (c8: lines, branches, functions per file).
      - run: npx c8 --all --include 'src/**' --include 'formats/*.js' --reporter=json-summary --report-dir "$RUNNER_TEMP/cov" npm test
      - name: Coverage of the unit tests
        if: always()
        run: node conformance/tools/coverage.mjs "$RUNNER_TEMP/cov/coverage-summary.json" "Coverage of the unit tests (npm test)"
