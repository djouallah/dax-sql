<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" width="1300" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>How dax-sql works: a model and a query in, one SQL SELECT out, tested against Power BI</title>
  <style>
    .bg { fill: #ffffff; }
    .label { fill: #6b7280; font-size: 12px; font-weight: 600; letter-spacing: .08em; }
    .pill { fill: #f3f4f6; stroke: #d1d5db; }
    .pill-t { fill: #111827; font-size: 13px; }
    .box { fill: #ffffff; stroke: #9ca3af; }
    .t { fill: #111827; font-size: 15px; font-weight: 650; }
    .s { fill: #4b5563; font-size: 12px; }
    .dax { fill: #6d28d9; stroke: #6d28d9; }
    .dax-t { fill: #ffffff; font-size: 16px; font-weight: 700; }
    .dax-s { fill: #ede9fe; font-size: 12px; }
    .plan { fill: #1d4ed8; stroke: #1d4ed8; }
    .plan-s { fill: #dbeafe; font-size: 12px; }
    .eng { fill: #ecfdf5; stroke: #10b981; }
    .eng-t { fill: #065f46; font-size: 14px; font-weight: 650; }
    .ref { fill: #fefce8; stroke: #eab308; }
    .ref-t { fill: #713f12; font-size: 15px; font-weight: 700; }
    .ref-s { fill: #854d0e; font-size: 12.5px; }
    .edge { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .edge-dax { stroke: #6d28d9; stroke-width: 1.8; fill: none; }
    .edge-ref { stroke: #eab308; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #9ca3af; } .head-dax { fill: #6d28d9; } .head-ref { fill: #eab308; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .label { fill: #8b949e; }
      .pill { fill: #161b22; stroke: #30363d; }
      .pill-t, .t { fill: #e6edf3; }
      .box { fill: #0d1117; stroke: #484f58; }
      .s { fill: #8b949e; }
      .eng { fill: #052e1f; stroke: #10b981; } .eng-t { fill: #6ee7b7; }
      .ref { fill: #2a2208; stroke: #eab308; } .ref-t { fill: #fde68a; } .ref-s { fill: #fcd34d; }
      .edge { stroke: #6e7681; } .head { fill: #6e7681; }
      .edge-dax { stroke: #a78bfa; } .head-dax { fill: #a78bfa; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-dax" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ref" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1300" height="500" rx="14"/>

  <!-- inputs: the model -->
  <text class="label" x="28" y="40">MODEL</text>
  <rect class="pill" x="28" y="54" width="170" height="32" rx="16"/><text class="pill-t" x="113" y="75" text-anchor="middle">.bim (TMSL)</text>
  <rect class="pill" x="28" y="96" width="170" height="32" rx="16"/><text class="pill-t" x="113" y="117" text-anchor="middle">TMDL</text>
  <rect class="pill" x="28" y="138" width="170" height="32" rx="16"/><text class="pill-t" x="113" y="159" text-anchor="middle">Ossie YAML</text>

  <!-- inputs: the query -->
  <text class="label" x="28" y="222">QUERY</text>
  <rect class="pill" x="28" y="236" width="170" height="32" rx="16"/><text class="pill-t" x="113" y="257" text-anchor="middle">DAX</text>
  <rect class="pill" x="28" y="292" width="170" height="32" rx="16"/><text class="pill-t" x="113" y="313" text-anchor="middle">SQL  SELECT … AGG(m)</text>
  <rect class="pill" x="28" y="334" width="170" height="32" rx="16"/><text class="pill-t" x="113" y="355" text-anchor="middle">Ossie wide JSON</text>

  <!-- the model, the SQL front end -->
  <rect class="box" x="262" y="82" width="190" height="64" rx="10"/>
  <text class="t" x="357" y="108" text-anchor="middle">Semantic model</text>
  <text class="s" x="357" y="128" text-anchor="middle">measures in DAX or Ossie SQL</text>
  <rect class="box" x="262" y="298" width="190" height="64" rx="10"/>
  <text class="t" x="357" y="324" text-anchor="middle">SQL front end</text>
  <text class="s" x="357" y="344" text-anchor="middle">writes the query as DAX</text>

  <path class="edge" d="M198 70 C230 70 230 104 260 106" marker-end="url(#a)"/>
  <path class="edge" d="M198 112 L260 112" marker-end="url(#a)"/>
  <path class="edge" d="M198 154 C230 154 230 120 260 118" marker-end="url(#a)"/>
  <path class="edge" d="M198 308 L260 322" marker-end="url(#a)"/>
  <path class="edge" d="M198 350 L260 338" marker-end="url(#a)"/>

  <!-- the DAX compiler -->
  <rect class="dax" x="510" y="186" width="210" height="90" rx="12"/>
  <text class="dax-t" x="615" y="220" text-anchor="middle">DAX compiler</text>
  <text class="dax-s" x="615" y="242" text-anchor="middle">filter context · DAX's blanks</text>
  <text class="dax-s" x="615" y="259" text-anchor="middle">every query, whatever its language</text>

  <path class="edge" d="M452 114 C490 114 480 210 508 214" marker-end="url(#a)"/>
  <path class="edge-dax" d="M198 252 C340 252 400 236 508 232" marker-end="url(#ad)"/>
  <path class="edge-dax" d="M452 330 C490 330 480 254 508 250" marker-end="url(#ad)"/>

  <!-- the plan -->
  <rect class="plan" x="760" y="191" width="150" height="80" rx="12"/>
  <text class="dax-t" x="835" y="222" text-anchor="middle">Query plan</text>
  <text class="plan-s" x="835" y="244" text-anchor="middle">Substrait,</text>
  <text class="plan-s" x="835" y="259" text-anchor="middle">correlated subqueries</text>
  <path class="edge" d="M720 231 L758 231" marker-end="url(#a)"/>

  <!-- the SQL writer -->
  <rect class="box" x="950" y="191" width="150" height="80" rx="12"/>
  <text class="t" x="1025" y="222" text-anchor="middle">SQL writer</text>
  <text class="s" x="1025" y="244" text-anchor="middle">reads the plan back,</text>
  <text class="s" x="1025" y="259" text-anchor="middle">one dialect's SQL</text>
  <path class="edge" d="M910 231 L948 231" marker-end="url(#a)"/>

  <!-- the engines -->
  <text class="label" x="1140" y="40">ONE SQL SELECT FOR</text>
  <rect class="eng" x="1140" y="54" width="140" height="40" rx="10"/><text class="eng-t" x="1210" y="79" text-anchor="middle">DuckDB ★</text>
  <rect class="eng" x="1140" y="106" width="140" height="40" rx="10"/><text class="eng-t" x="1210" y="131" text-anchor="middle">Polars</text>
  <rect class="eng" x="1140" y="158" width="140" height="40" rx="10"/><text class="eng-t" x="1210" y="183" text-anchor="middle">DataFusion</text>
  <rect class="eng" x="1140" y="210" width="140" height="40" rx="10"/><text class="eng-t" x="1210" y="229" text-anchor="middle">T-SQL</text>
  <text class="s" x="1210" y="244" text-anchor="middle" style="font-size:10.5px">Fabric SQL endpoint</text>
  <path class="edge" d="M1100 220 C1120 220 1112 76 1138 74" marker-end="url(#a)"/>
  <path class="edge" d="M1100 226 C1120 226 1114 128 1138 126" marker-end="url(#a)"/>
  <path class="edge" d="M1100 231 C1120 231 1116 180 1138 178" marker-end="url(#a)"/>
  <path class="edge" d="M1100 236 L1138 230" marker-end="url(#a)"/>

  <!-- the reference -->
  <rect class="ref" x="262" y="396" width="1018" height="54" rx="12"/>
  <text class="ref-t" x="286" y="420">Tested against Power BI, not guaranteed to match it</text>
  <text class="ref-s" x="286" y="439">Each engine's answers are compared with Power BI's; every known difference is listed, a departure by design or a bug not fixed yet.</text>
  <text class="s" x="1210" y="272" text-anchor="middle" style="font-size:11px">★ works best: it unnests the</text>
  <text class="s" x="1210" y="287" text-anchor="middle" style="font-size:11px">plan's correlated subqueries;</text>
  <text class="s" x="1210" y="302" text-anchor="middle" style="font-size:11px">others can be slower or refuse</text>
  <path class="edge-ref" d="M1210 312 L1210 394" marker-end="url(#ar)"/>
  <text class="s" x="28" y="482"><tspan style="font-weight:600">Why SQL and not the Substrait plan itself?</tspan> The plan follows Substrait's main branch, its newest spec, which no engine reads yet: dax-sql reads it back and writes each engine's SQL.</text>
</svg>
